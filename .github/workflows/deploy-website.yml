name: Deploy website to GitHub Pages

# Builds the Docusaurus site in website/ and publishes it to GitHub Pages.
#
# Content flow:
#   Your machine: run digest -> push .md to MinIO -> trigger THIS workflow
#   (via workflow_dispatch from trigger_deploy.py). THIS workflow pulls the
#   .md from MinIO into ./summaries, builds, and deploys to Pages.
#
# This workflow never touches Postgres or the LLM — it only reads .md from MinIO.
#
# To trigger from your machine after a digest run:
#   python trigger_deploy.py        (see that script), or
#   scripts/trigger_deploy.sh
#
# We use workflow_dispatch (not repository_dispatch) because of
# actions/deploy-pages#383: repeated repository_dispatch runs against the same
# commit SHA silently keep the old Pages artifact, so the site never updates.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   MINIO_ENDPOINT   e.g. minio-api.smartsolar.io.vn  (host only, no scheme)
#   MINIO_ACCESS_KEY (read-only key recommended)
#   MINIO_SECRET_KEY
#   MINIO_BUCKET     e.g. dtung.vu
# Optional repository variables (Settings -> Variables):
#   MINIO_SECURE     'true' (default) for https, 'false' for http

on:
  # Triggered from your machine after a digest run completes
  # (trigger_deploy.py calls the workflow_dispatch API), or via the GitHub UI
  # "Run workflow" button when you change website code and want a rebuild.
  workflow_dispatch: {}

# Allow this workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Rolling cache of ./summaries across runs. The runner starts empty, so
      # without this every run would re-download ALL digests from MinIO. We
      # restore last run's summaries first; then `aws s3 sync --delete` below
      # only fetches the day's new/changed file (and removes deleted ones).
      #   key         is unique per run  -> a fresh cache (with today's file) is
      #               always SAVED at the end of the run.
      #   restore-keys 'summaries-' prefix -> the most recent prior cache is
      #               RESTORED at the start. Self-updating, no manual bumping.
      - name: Restore cached digests
        uses: actions/cache@v4
        with:
          path: summaries
          key: summaries-${{ github.run_id }}
          restore-keys: |
            summaries-

      - name: Pull digests from MinIO into ./summaries
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
          MINIO_BUCKET: ${{ secrets.MINIO_BUCKET }}
          MINIO_SECURE: ${{ vars.MINIO_SECURE || 'true' }}
        run: |
          scheme=https
          if [ "$MINIO_SECURE" = "false" ]; then scheme=http; fi
          mkdir -p summaries
          # MinIO exposes an S3-compatible API, so the AWS CLI (preinstalled
          # on GitHub-hosted runners) can sync straight against it. We used to
          # shell out to MinIO's own `mc` client, but upstream archived the
          # open-source client -- dl.min.io/client/... now returns 410, and
          # its replacement build is under MinIO's commercial Enterprise
          # License. Using the AWS CLI avoids depending on it entirely.
          aws s3 sync "s3://$MINIO_BUCKET/summaries" summaries \
            --endpoint-url "$scheme://$MINIO_ENDPOINT" --delete
          echo "Pulled $(find summaries -name '*.md' | wc -l) digest file(s)."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
